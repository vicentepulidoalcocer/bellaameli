<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catálogo en línea de NICE, Farmasi y Natura. Arma tu pedido y envíalo por WhatsApp."
    />
    <title>Bella Amelí · NICE · Farmasi · Natura</title>

    <!-- Tipografías: Fraunces (títulos elegantes) + Karla (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Evita el "parpadeo" de tema: aplica modo oscuro antes de renderizar -->
    <script>
      try {
        var tema = localStorage.getItem('tienda_tema');
        if (tema === 'oscuro' || (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
